name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-web:
    name: Deploy Web → arq.iae.wtf
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Instalar dependências
        run: |
          source ~/.nvm/nvm.sh && nvm use 22
          pnpm install --frozen-lockfile

      - name: Build web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          source ~/.nvm/nvm.sh && nvm use 22
          pnpm build --filter=@arq/web

      - name: Reload nginx
        run: sudo nginx -s reload

  deploy-api:
    name: Deploy API → AWS Lambda
    runs-on: ubuntu-latest
    environment: production
    if: false  # habilitar quando API estiver pronta

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Deploy Serverless
        working-directory: apps/api
        env:
          DAILY_API_KEY: ${{ secrets.DAILY_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npx serverless deploy --stage prod --verbose
