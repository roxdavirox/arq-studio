name: Project Automation

on:
  issues:
    types: [opened, reopened, closed, labeled]
  pull_request:
    types: [opened, reopened, closed, ready_for_review]
  discussion:
    types: [created]

env:
  PROJECT_ID: ${{ vars.PROJECT_ID }}
  STATUS_FIELD_ID: ${{ vars.STATUS_FIELD_ID }}
  STATUS_BACKLOG: ${{ vars.STATUS_BACKLOG }}
  STATUS_TODO: ${{ vars.STATUS_TODO }}
  STATUS_IN_PROGRESS: ${{ vars.STATUS_IN_PROGRESS }}
  STATUS_IN_REVIEW: ${{ vars.STATUS_IN_REVIEW }}
  STATUS_DONE: ${{ vars.STATUS_DONE }}
  PRIORITY_FIELD_ID: ${{ vars.PRIORITY_FIELD_ID }}
  PRIORITY_URGENT: ${{ vars.PRIORITY_URGENT }}
  PRIORITY_HIGH: ${{ vars.PRIORITY_HIGH }}
  PRIORITY_MEDIUM: ${{ vars.PRIORITY_MEDIUM }}
  PRIORITY_LOW: ${{ vars.PRIORITY_LOW }}
  SIZE_FIELD_ID: ${{ vars.SIZE_FIELD_ID }}
  SIZE_XS: ${{ vars.SIZE_XS }}
  SIZE_S: ${{ vars.SIZE_S }}
  SIZE_M: ${{ vars.SIZE_M }}
  SIZE_L: ${{ vars.SIZE_L }}
  SIZE_XL: ${{ vars.SIZE_XL }}

jobs:
  automate:
    name: Atualizar board
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Obter token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true

      - name: Usar PAT como fallback
        if: steps.token.outcome == 'failure'
        run: echo "GH_TOKEN=${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Definir token
        if: steps.token.outcome == 'success'
        run: echo "GH_TOKEN=${{ steps.token.outputs.token }}" >> $GITHUB_ENV

      # ── Issue aberta → Todo ──────────────────────────────────────────────
      - name: Issue aberta → Todo
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env:
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: |
          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                item { id }
              }
            }
          ' -f projectId="$PROJECT_ID" -f contentId="$ISSUE_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId,
                fieldId: $fieldId, value: {singleSelectOptionId: $value}
              }) { projectV2Item { id } }
            }
          ' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" \
            -f fieldId="$STATUS_FIELD_ID" -f value="$STATUS_TODO"

      # ── Issue labeled priority:* ─────────────────────────────────────────
      - name: Atualizar Priority via label
        if: github.event_name == 'issues' && github.event.action == 'labeled'
        env:
          ISSUE_ID: ${{ github.event.issue.node_id }}
          LABEL: ${{ github.event.label.name }}
        run: |
          case "$LABEL" in
            priority:urgent) PRIORITY_VALUE="$PRIORITY_URGENT" ;;
            priority:high)   PRIORITY_VALUE="$PRIORITY_HIGH" ;;
            priority:medium) PRIORITY_VALUE="$PRIORITY_MEDIUM" ;;
            priority:low)    PRIORITY_VALUE="$PRIORITY_LOW" ;;
            size:xs) SIZE_VALUE="$SIZE_XS" ;;
            size:s)  SIZE_VALUE="$SIZE_S" ;;
            size:m)  SIZE_VALUE="$SIZE_M" ;;
            size:l)  SIZE_VALUE="$SIZE_L" ;;
            size:xl) SIZE_VALUE="$SIZE_XL" ;;
            *) exit 0 ;;
          esac

          ITEM_ID=$(gh api graphql -f query='
            query($nodeId: ID!) {
              node(id: $nodeId) {
                ... on Issue {
                  projectItems(first: 1) { nodes { id } }
                }
              }
            }
          ' -f nodeId="$ISSUE_ID" --jq '.data.node.projectItems.nodes[0].id // empty')

          if [ -z "$ITEM_ID" ]; then exit 0; fi

          FIELD_ID="${PRIORITY_VALUE:+$PRIORITY_FIELD_ID}${SIZE_VALUE:+$SIZE_FIELD_ID}"
          VALUE="${PRIORITY_VALUE:-$SIZE_VALUE}"

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId,
                fieldId: $fieldId, value: {singleSelectOptionId: $value}
              }) { projectV2Item { id } }
            }
          ' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" \
            -f fieldId="$FIELD_ID" -f value="$VALUE"

      # ── Issue fechada → Done ─────────────────────────────────────────────
      - name: Issue fechada → Done
        if: github.event_name == 'issues' && github.event.action == 'closed'
        env:
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: |
          ITEM_ID=$(gh api graphql -f query='
            query($nodeId: ID!) {
              node(id: $nodeId) {
                ... on Issue { projectItems(first: 1) { nodes { id } } }
              }
            }
          ' -f nodeId="$ISSUE_ID" --jq '.data.node.projectItems.nodes[0].id // empty')

          if [ -z "$ITEM_ID" ]; then exit 0; fi

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId,
                fieldId: $fieldId, value: {singleSelectOptionId: $value}
              }) { projectV2Item { id } }
            }
          ' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" \
            -f fieldId="$STATUS_FIELD_ID" -f value="$STATUS_DONE"

      # ── PR aberta → In Review ────────────────────────────────────────────
      - name: PR aberta → In Review
        if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'ready_for_review')
        env:
          PR_ID: ${{ github.event.pull_request.node_id }}
        run: |
          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                item { id }
              }
            }
          ' -f projectId="$PROJECT_ID" -f contentId="$PR_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId,
                fieldId: $fieldId, value: {singleSelectOptionId: $value}
              }) { projectV2Item { id } }
            }
          ' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" \
            -f fieldId="$STATUS_FIELD_ID" -f value="$STATUS_IN_REVIEW"

      # ── PR mergeada → Done ───────────────────────────────────────────────
      - name: PR mergeada → Done
        if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true
        env:
          PR_ID: ${{ github.event.pull_request.node_id }}
        run: |
          ITEM_ID=$(gh api graphql -f query='
            query($nodeId: ID!) {
              node(id: $nodeId) {
                ... on PullRequest { projectItems(first: 1) { nodes { id } } }
              }
            }
          ' -f nodeId="$PR_ID" --jq '.data.node.projectItems.nodes[0].id // empty')

          if [ -z "$ITEM_ID" ]; then exit 0; fi

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId,
                fieldId: $fieldId, value: {singleSelectOptionId: $value}
              }) { projectV2Item { id } }
            }
          ' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" \
            -f fieldId="$STATUS_FIELD_ID" -f value="$STATUS_DONE"

      # ── Discussion criada → Backlog ──────────────────────────────────────
      - name: Discussion → Backlog
        if: github.event_name == 'discussion' && github.event.action == 'created'
        env:
          DISCUSSION_ID: ${{ github.event.discussion.node_id }}
        run: |
          ITEM_ID=$(gh api graphql -f query='
            mutation($projectId: ID!, $contentId: ID!) {
              addProjectV2ItemById(input: {projectId: $projectId, contentId: $contentId}) {
                item { id }
              }
            }
          ' -f projectId="$PROJECT_ID" -f contentId="$DISCUSSION_ID" \
            --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $value: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $projectId, itemId: $itemId,
                fieldId: $fieldId, value: {singleSelectOptionId: $value}
              }) { projectV2Item { id } }
            }
          ' -f projectId="$PROJECT_ID" -f itemId="$ITEM_ID" \
            -f fieldId="$STATUS_FIELD_ID" -f value="$STATUS_BACKLOG"
